<div *ngIf="opened" class="modal-overlay" (click)="onCancel()">
  <div class="modal-container" (click)="$event.stopPropagation()">
    <h2 class="modal-title">Criar Nova Nota</h2>

    <form [formGroup]="noteForm" (ngSubmit)="onSave()">
      <mat-form-field appearance="fill" class="form-field">
        <mat-label>Título</mat-label>
        <input matInput formControlName="title" cdkFocusInitial>
      </mat-form-field>

      <mat-form-field appearance="fill" class="form-field">
        <mat-label>Tag (Opcional)</mat-label>
        <input matInput formControlName="tag">
      </mat-form-field>

      <mat-form-field appearance="fill" class="form-field">
        <mat-label>Conteúdo</mat-label>
        <textarea 
          matInput 
          formControlName="content"
          rows="6"
          placeholder="Escreva sua nota aqui..."
        ></textarea>
      </mat-form-field>

      <div class="modal-actions">
        <button mat-button type="button" (click)="onCancel()">Cancelar</button>
        <button mat-raised-button color="primary" type="submit" [disabled]="!noteForm.valid">Salvar</button>
      </div>
    </form>
  </div>
</div>
