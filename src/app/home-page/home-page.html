<div class="home-page-container">
  <div class="main-content">
    <header class="header-content">
      <input type="text" placeholder="Pesquisar..." class="search-bar" />
    </header>
    <div style="flex: 1; padding: 24px">
      <!-- main content -->
    </div>
  </div>
  <mat-sidenav-container>
    <mat-sidenav #sidenav mode="over" [(opened)]="opened">
      <ul class="sidenav-list">
        <li>
          <button>
            <img src="assets/images/mais.svg" class="sidenavImage" />
          </button>
        </li>
        <li>
          <button>
            <img src="assets/images/sino.svg" class="sidenavImage" />
          </button>
        </li>
        <li>
          <button>
            <img src="assets/images/casa.svg" class="sidenavImage" />
          </button>
        </li>
      </ul>
    </mat-sidenav>
    <mat-sidenav-content>
      <button mat-button (click)="sidenav.toggle()">
        <img src="assets/images/menu-hamburguer.svg" class="sidenavImage" />
      </button>
      <div *ngFor="let e of events">{{e}}</div>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
